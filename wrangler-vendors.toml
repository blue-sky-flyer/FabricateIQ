name = "fabricateiq-vendors"
main = "workers/vendor-refresh.js"
compatibility_date = "2024-01-01"

# Persist console.* output to searchable Workers Logs (Cloudflare dashboard)
[observability]
enabled = true

# Account and zone IDs are optional - wrangler will prompt if needed
# account_id = ""

[triggers]
# Run at midnight UTC on the 1st of every 3rd month (Jan, Apr, Jul, Oct)
crons = ["0 0 1 */3 *"]

[[kv_namespaces]]
binding = "VENDOR_KV"
# After running: npx wrangler kv:namespace create "VENDOR_VENDORS"
# paste the returned id here:
id = "789dda9be91a42b6a67849a04e8ffcfd"
# For local dev (wrangler dev), use preview_id:
# preview_id = ""

# Secrets must be set via CLI:
# npx wrangler secret put ANTHROPIC_API_KEY  -c wrangler-vendors.toml
# npx wrangler secret put WORKER_AUTH_TOKEN  -c wrangler-vendors.toml

# Deploy command:
# npx wrangler deploy -c wrangler-vendors.toml
